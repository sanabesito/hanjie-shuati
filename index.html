, {"tag": "抽头式重合率", "q": "抽头式弧焊变压器（BX6）中，重合率λ的定义是：", "opts": ["λ=If/Ie", "λ=δ12/δ", "λ=N2/N1", "λ=N12/N1（漏磁绕组匝数与一次绕组匝数之比）"], "ans": "B", "points": "重合率λ=N12/N1，漏抗XL=K(1−λ)N2²。改变抽头→λ变化→漏抗变化→有级调节焊接电流。"}, {"tag": "型号含义", "q": "型号BX1-300中，“B”“X”“1”“300”分别表示：", "opts": ["保护、信号、一次侧、300Hz", "变压器、旋转式、第一代、300W", "变压器、平特性、动绕组、300V", "弧焊变压器、下降特性、动铁心式、额定电流300A"], "ans": "D", "points": "B=弧焊变压器，X=下降外特性，1=动铁心式（2=串联电抗器同体式，3=动绕组式，6=抽头式），300=额定焊接电流300A。"}], "fill": [{"tag": "两大构成", "q": "弧焊变压器的两大组成部分是____（主变压器）和提供____的装置（电抗器或增强漏磁）。", "ans": ["变压器", "感抗"], "points": "主变压器降压；电抗器/增强漏磁提供下降特性所需感抗，并用于调节电流。"}, {"tag": "感抗调节气隙", "q": "电抗器式弧焊变压器通过改变____的大小来调节感抗Xk，从而调节焊接电流。", "ans": ["气隙δ"], "points": "Xk∝N²/δ，气隙增大感抗减小、电流增大；气隙减小感抗增大、电流减小。"}, {"tag": "分类总述", "q": "弧焊变压器按获得下降外特性的方法分为____式（分体/同体）和____式（动铁/动圈/抽头）两大类。", "ans": ["串联电抗器", "增强漏磁"], "points": "串联电抗器式在次级回路串联电抗器；增强漏磁式依靠变压器自身结构增加漏抗。"}, {"tag": "动铁心漏抗", "q": "动铁心式弧焊变压器附加漏抗约等于____（μ0为真空磁导率，N为绕组匝数，Sδ为气隙面积，δ为气隙）。", "ans": ["μ0N²Sδ/δ"], "points": "动铁心把漏磁路分流，移动铁心改变δ→kM与漏抗变化→调节电流。"}, {"tag": "BX3粗调", "q": "BX3型弧焊变压器电流粗调通过改变____绕组的匝数（两段____联/____联）实现。", "ans": ["二次", "串", "并"], "points": "二次绕组两段串联（小电流档）或并联（大电流档）实现有级粗调；移动绕组改变δ12实现细调。"}, {"tag": "BX6特点", "q": "BX6型抽头式弧焊变压器结构简单、省料、轻便，但电流调节是____级的，且负载持续率较低（约____%）。", "ans": ["有", "10~20"], "points": "BX6-140调节电流范围35~190A、额定负载持续率约10%，仅适用于中、小容量的手工电弧焊。"}, {"tag": "BX1系列", "q": "BX1型动铁心式弧焊变压器典型电流调节范围为____A（如BX1-300），通过____机构移动可动铁心。", "ans": ["75~400", "螺旋调节"], "points": "矩形铁心可获得75~400A的调节范围；梯形铁心用于小容量焊机调节范围窄。"}, {"tag": "电源频率", "q": "弧焊变压器只能输出____（交流/直流）焊接电流，其输出电流频率与电网相同。", "ans": ["交流"], "points": "弧焊变压器本质是变压器，输出工频交流电，用于交流焊接方法（交流手工焊、埋弧焊）。"}]}, {"ch": 4, "title": "第四章 电子控制弧焊电源基础", "mcq": [{"tag": "全控器件", "q": "下列电力半导体器件中属于全控型器件的是：", "opts": ["IGBT", "双向晶闸管", "整流二极管", "晶闸管（SCR）"], "ans": "A", "points": "全控型（自关断）器件：GTR、GTO、功率MOSFET、IGBT，可控制开通和关断；半控型只有晶闸管（只能控制开通）。"}, {"tag": "驱动方式", "q": "功率MOSFET与IGBT的控制信号类型是：", "opts": ["电流信号", "电压信号", "光信号", "磁信号"], "ans": "B", "points": "功率MOSFET、IGBT为电压驱动，驱动功率小；SCR（晶闸管）、GTR为电流驱动，驱动功率大。"}, {"tag": "外特性控制原理", "q": "电子控制型弧焊电源外特性控制的基本公式是（Ugu为给定电压，Ugi为给定电流，mUf、nIf为反馈量）：", "opts": ["Uk=K3[K1(Ugu−mUf)+K2(Ugi−nIf)]", "Uk=K3[K1(Ugu+mUf)+K2(Ugi+nIf)]", "Uk=K1(Ugu−mUf)", "Uk=K2(Ugi−nIf)"], "ans": "A", "points": "控制信号Uk由给定信号与反馈信号之差合成，K1、K2为反馈系数，K3为放大器增益；反馈取法决定外特性形状。"}, {"tag": "只取电压反馈", "q": "控制电路中只取电压负反馈（只取Ugu−mUf）时，电源获得的外特性是：", "opts": ["平特性（恒压）", "双阶梯特性", "恒流带外拖特性", "陡降（恒流）特性"], "ans": "C", "points": "只取电压负反馈→输出电压基本恒定→平（恒压）特性；只取电流负反馈→输出电流基本恒定→陡降（恒流）特性。"}, {"tag": "电流截止反馈", "q": "外特性控制中采用“电流截止”反馈（只取Ugi−nIf且If超过给定值时反馈）可获得：", "opts": ["陡降恒流特性", "上升特性", "水平特性", "平特性"], "ans": "C", "points": "电流负反馈使电流超过给定值时控制信号快速下降→外特性陡降，形成恒流特性。"}, {"tag": "复合反馈", "q": "复合负反馈控制中，“同时反馈”方式可获得的外特性是：", "opts": ["纯陡降特性", "斜线形状（斜率可调）", "双阶梯特性", "纯平特性"], "ans": "D", "points": "电压、电流反馈同时作用→外特性为斜线，斜率由反馈强度（K1/K2）比例决定，可做成缓降或斜缓特性。"}, {"tag": "分时反馈", "q": "陡降带外拖外特性中，外拖段拐点电压Uth一般取：", "opts": ["4~6V", "8~15V", "20~30V", "50~80V"], "ans": "B", "points": "Uth取8~15V：正常燃弧段（电压>Uth）为陡降恒流段，短路时（电压\u003cUth）切换到低电压大电流外拖段，保证短路引弧和熔滴过渡。"}, {"tag": "LEM传感器", "q": "LEM（磁平衡式霍尔）电流传感器的工作原理与特点是：", "opts": ["只能测直流", "需要与被测回路串联大电阻", "直接放大被测电流", "副边补偿电流Is产生的磁场与原边电流Id产生的磁场相平衡（IsNs=IdNd），响应快、抗干扰、可测任意波形"], "ans": "D", "points": "LEM按等安匝平衡原理工作：IsNs=IdNd，输出经放大后驱动补偿电流，反应时间约1μs，抗干扰强，可测直流/交流/脉冲任意波形。"}, {"tag": "霍尔直测式", "q": "直测式霍尔传感器输出电压UH的表达式为（KH为霍尔系数，I为控制电流，B为磁感应强度，d为厚度）：", "opts": ["UH=KH·B·d/I", "UH=KH·I·B/d", "UH=KH·d/(I·B)", "UH=KH·I·d/B"], "ans": "D", "points": "UH=KH·IB/d=SH·IB，SH=KH/d为灵敏度；输出电压为毫伏级，需放大；输入（控制电流）要求恒流源供电。"}, {"tag": "调节特性", "q": "电子控制型弧焊电源的调节特性（调节电流）通常通过改变哪个量实现？", "opts": ["改变电网频率", "改变反馈系数K3", "改变给定电流Ugi（外特性左右平移）", "改变变压器匝数"], "ans": "A", "points": "调节Ugi→外特性曲线左右平移→调节电流；调节Ugu→曲线上下移动→调节电压。反馈网络R7、R10等决定反馈量。"}, {"tag": "稳压电源", "q": "三端固定输出稳压器78XX系列输出为：", "opts": ["正电压（+5V、+12V等）", "可调电压", "交流电压", "负电压（-5V等）"], "ans": "C", "points": "78XX输出固定正电压（7805=+5V、7812=+12V），79XX输出负电压（7905=-5V）；LM317/LM337为三端可调（1.25~35V）。"}, {"tag": "STT波形", "q": "表面张力过渡（STT）波形控制中，短路末期（液桥即将断开）的控制策略是：", "opts": ["切断电源", "增大电流促进爆断", "维持大电流不变", "降低电流，靠表面张力Fσ=2πrσ将液桥拉断，减少飞溅"], "ans": "B", "points": "短路末期缩颈处电流密度大、电磁收缩力强，若大电流爆断会产生细颗粒飞溅；故末期降流，靠表面张力断桥，飞溅小、成形好。"}], "fill": [{"tag": "器件分类", "q": "电力半导体器件按控制方式分为____（SCR）、____（GTR、GTO等）和____（功率MOSFET、IGBT）三类。", "ans": ["不可控", "半控", "全控"], "points": "不可控器件只能整流不能控制导通时刻（二极管）；半控可控制开通不能关断（晶闸管）；全控可控制开通与关断。"}, {"tag": "基本组成", "q": "电子控制型弧焊电源由____电路（主电路）和____电路（控制电路）两部分组成。", "ans": ["功率变换（主）", "控制（触发、给定、反馈、放大）"], "points": "主电路实现电能变换（整流、滤波、逆变、稳压等）；控制电路包括触发、给定、反馈、放大等环节，实现外特性与动特性控制。"}, {"tag": "反馈取法", "q": "外特性控制中，只取电压负反馈得____特性，只取电流负反馈得____特性，电压电流同时反馈得____特性。", "ans": ["平（恒压）", "陡降（恒流）", "斜线（斜率可调）"], "points": "反馈量取自Uf与If（经m、n系数），反馈网络电阻决定外特性斜率。"}, {"tag": "信号检测", "q": "电流检测的取样方法有____电阻（分流器，Ufi=nIf）和____直测式传感器、磁平衡式传感器（LEM）。", "ans": ["取样", "霍尔"], "points": "取样电阻法：电流经分流器得电压信号nIf；霍尔法：直测式UH=KHIB/d、磁平衡式LEM等安匝平衡。"}, {"tag": "LEM等安匝", "q": "LEM磁平衡式电流传感器依据____定律工作，其平衡方程为____。", "ans": ["安培环路", "IsNs=IdNd"], "points": "原边被测电流Id与副边补偿电流Is的安匝数相等、方向相反时磁芯磁通为零，此时Is反映被测电流。"}, {"tag": "电子电抗器", "q": "电子电抗器实质是一个____电路，使输出电流按____规律上升，实现焊接电流动态控制。", "ans": ["积分", "积分（斜坡）"], "points": "If∝∫(Ugu−mUf)dt，积分时间常数即等效电感，可实现di/dt控制、限制短路电流上升率。"}, {"tag": "稳压器类型", "q": "三端稳压器按输出类型分为固定输出（78XX正/79XX负）和可调输出（LM317/LM337，范围____V）。", "ans": ["1.25~35"], "points": "LM317正可调1.25~35V、LM337负可调；输入输出压差要求UI>Uo+2V。"}, {"tag": "基准电压源", "q": "精密基准电压源中，____（型号）为可调精密并联稳压器（2.5V基准），常用于给定电压源电路。", "ans": ["TL431"], "points": "TL431输出2.5V基准可调；LM336为精密电压基准（2.5V/5V等）；78L05为三端小功率固定+5V。"}]}, {"ch": 5, "title": "第五章 晶闸管式弧焊整流器", "mcq": [{"tag": "晶闸管特点", "q": "晶闸管式弧焊整流器相对旋转式弧焊发电机的主要优点不包括：", "opts": ["体积小、寿命长", "动特性好、控制性好", "省材节能、噪声小", "电路简单、维修容易"], "ans": "B", "points": "晶闸管弧焊整流器优点是动特性好、控制性好、省材节能、噪声小、体积小寿命长；缺点是电路较复杂、需要触发电路等。"}, {"tag": "基本构成", "q": "晶闸管式弧焊整流器的基本构成是：", "opts": ["三相变压器+晶闸管整流器+移相触发电路", "单相变压器+二极管", "逆变器+高频变压器", "发电机+电动机"], "ans": "A", "points": "由三相降压变压器、晶闸管整流器和移相触发电路构成，输出经电抗器滤波成焊接电流。"}, {"tag": "三相半控桥", "q": "三相半控桥式整流电路中晶闸管的导通角与每周期输出脉动数为：", "opts": ["导通120°、3次脉动", "导通60°、6次脉动", "导通60°、3次脉动", "导通120°、6次脉动"], "ans": "C", "points": "三相半控桥3只晶闸管、每管导通120°、每周期3次脉动；三相全控桥6管、每管120°、每周期6次脉动。"}, {"tag": "半控桥输出", "q": "三相半控桥整流电路输出平均电压Ud与触发角α的关系为：", "opts": ["Ud=1.35U2cosα", "Ud=2.34U2cosα", "Ud=1.17U2cosα", "Ud=1.17U2(1+cosα)"], "ans": "B", "points": "三相半控桥：Ud=1.17U2(1+cosα)，移相范围0~180°；三相全控桥：Ud=2.34U2cosα；六相半波：Ud=1.35U2cosα；双反星形：Ud=1.17U2cosα。"}, {"tag": "全控桥移相", "q": "三相全控桥带电阻负载时的移相范围为（60°处临界连续）：", "opts": ["0~60°", "0~90°", "0~120°", "0~180°"], "ans": "A", "points": "三相全控桥电阻负载移相0~120°（60°为临界连续点）；电感负载0~90°（90°时输出为零）。触发脉冲互差60°。"}, {"tag": "全控桥应用", "q": "采用三相全控桥式主电路的典型机型是：", "opts": ["美国米勒（Miller）焊机与ZX5-400B", "林肯（Lincoln）DC-600", "ZX7-400", "ZX5-400B与国产ZDK-500"], "ans": "C", "points": "课件记载：美国米勒公司与国产ZX5-400B采用三相全控桥；六相半波用于林肯DC-600；ZDK-500用六套触发。"}, {"tag": "六相半波", "q": "六相半波整流电路中每只晶闸管的导通角与触发脉冲频率为：", "opts": ["导通60°、150Hz", "导通30°、300Hz", "导通120°、300Hz", "导通60°、300Hz"], "ans": "D", "points": "六相半波6管、每管导通60°、触发脉冲频率300Hz（每周期6个触发脉冲，电网50Hz×6）；移相范围0~90°（电感负载）。"}, {"tag": "双反星形", "q": "带平衡电抗器的双反星形整流电路中，每只晶闸管承担的负载电流为：", "opts": ["1/2 Id", "全部Id", "1/3 Id", "1/6 Id"], "ans": "D", "points": "两组三相半波并联，每管导通120°、承担1/6负载电流（三相半控桥为1/3），管子利用率与散热改善，适合大电流。"}, {"tag": "平衡电抗器", "q": "双反星形电路中平衡电抗器（LB）的作用与临界电流的关系是：", "opts": ["只在大电流时起作用", "仅用于滤波", "可有可无", "必须加装，且当负载电流小于临界电流（约额定2%~5%）时失去平衡作用，两组轮流工作"], "ans": "D", "points": "平衡电抗器使两组三相半波同时工作（两管并联导通）；负载电流小于临界值（约2%~5%额定电流）时LB失去平衡作用，变为六相半波工作。"}, {"tag": "触发电路要求", "q": "晶闸管触发电路输出的触发信号功率要求为：", "opts": ["10~20V、500mA以上", "5V、10mA", "100V、1A", "2~4V、50~200mA"], "ans": "B", "points": "触发信号要求有足够功率（2~4V、50~200mA），与主电路同步，且有足够的移相范围，前沿要陡。"}, {"tag": "触发套数", "q": "ZX5系列晶闸管弧焊整流器采用双反星形主电路，其触发电路套数为：", "opts": ["六套", "三套", "两套（共阳极组与共阴极组）", "一套"], "ans": "C", "points": "ZX5系列两套触发电路分别触发两组晶闸管（同相共用）；ZDK-500用六套；三套为同相触发方式。"}, {"tag": "单结晶体管", "q": "单结晶体管（双基极二极管）张弛振荡器中，当发射极电压达到峰点电压Up时：", "opts": ["电容停止充电", "管子截止", "管子进入负阻区导通，电容通过eb1迅速放电，输出触发脉冲", "管子进入饱和区"], "ans": "A", "points": "电容充电至Up后，单结晶体管进入负阻区、eb1间电阻突然减小，电容经eb1放电在基极输出尖脉冲；放至谷点电压Uv后管子截止、重新充电，形成张弛振荡。"}], "fill": [{"tag": "结构构成", "q": "晶闸管式弧焊整流器由____变压器、____整流器和____触发电路三部分组成。", "ans": ["三相降压", "晶闸管", "移相"], "points": "三相降压变压器降压→晶闸管整流器整流→移相触发电路控制导通角；输出加电抗器滤波。"}, {"tag": "优点缺点", "q": "晶闸管弧焊整流器的优点是动特性好、____性好、省材节能、噪声小；缺点是____较复杂。", "ans": ["控制", "电路"], "points": "控制性好（反馈易实现各种外特性）；电路复杂、对元件要求高是其主要缺点。"}, {"tag": "半控桥参数", "q": "三相半控桥电路共需____只晶闸管，每管导通____°，输出每周期脉动____次。", "ans": ["3", "120", "3"], "points": "3只管、120°导通、3次脉动；与自然换相点重合（换相不经电网零点）、移相0~180°。"}, {"tag": "全控桥参数", "q": "三相全控桥电路共____只管、每管导通____°、输出每周期脉动____次，触发脉冲互差____°。", "ans": ["6", "120", "6", "60"], "points": "6管、120°导通、6次脉动（波形最平缓）；需要双窄脉冲或单宽脉冲，自然换相点在相电压过零后60°。"}, {"tag": "四电路Ud", "q": "三相半控桥Ud=____U2(1+cosα)，三相全控桥Ud=____U2cosα，六相半波Ud=____U2cosα，双反星形Ud=____U2cosα。", "ans": ["1.17", "2.34", "1.35", "1.17"], "points": "四主电路输出平均电压公式；双反星形与半控桥系数相同但工作原理不同。"}, {"tag": "双反星形触发", "q": "双反星形电路两组晶闸管触发脉冲互差____°，两组管子交替并联导通。", "ans": ["120"], "points": "两组三相半波、每组内脉冲互差120°；平衡电抗器保证两管同时导通、输出6波峰。"}, {"tag": "同步要求", "q": "触发电路与主电路____（同步/不同步）是晶闸管整流输出稳定的前提，触发脉冲须与电源电压同相位。", "ans": ["同步"], "points": "触发脉冲必须与晶闸管阳极电压同步，否则各周期导通角不一致、输出不稳定。"}, {"tag": "ZX5控制", "q": "ZX5系列晶闸管弧焊整流器采用____反星形主电路、____套触发电路和电流负反馈实现____外特性，并设置____电路。", "ans": ["双", "两", "下降", "引弧推力"], "points": "ZX5-250~630：双反星形+两套触发+电流负反馈下降外特性+引弧推力电路，用于焊条电弧焊。"}]}, {"ch": 6, "title": "第六章 逆变式弧焊电源", "mcq": [{"tag": "逆变定义", "q": "逆变式弧焊电源中“逆变”是指：", "opts": ["直流变直流", "交流变直流", "直流变交流", "交流变交流（变频）"], "ans": "A", "points": "逆变是直流→交流的变换过程。弧焊逆变电源先把工频交流整流成直流，再经逆变器变成中频交流，供高频变压器降压。"}, {"tag": "三种逆变形式", "q": "下列逆变弧焊电源形式中，用于铝、镁及其合金方波交流焊接的是：", "opts": ["AC-AC-DC", "AC-DC-AC（少用）", "AC-DC-AC-DC（直流焊机）", "AC-DC-AC-DC-AC（方波交流）"], "ans": "B", "points": "AC-DC-AC-DC-AC：整流→逆变→再整流→逆变输出方波交流，用于铝镁方波交流焊（如交流TIG）；AC-DC-AC-DC为直流焊机常用；AC-DC-AC很少单独使用。"}, {"tag": "器件开关速度", "q": "按开关速度从慢到快排列的电力电子器件为：", "opts": ["VMOS→IGBT→GTR→SCR", "GTR→SCR→VMOS→IGBT", "IGBT→VMOS→GTR→SCR", "SCR→GTR→IGBT→VMOS"], "ans": "D", "points": "开关速度：SCR 25~100μs、GTR 1~5μs、IGBT 0.5~1μs、VMOS（功率MOSFET）0.1~0.5μs，即SCR最慢、VMOS最快。"}, {"tag": "IGBT驱动", "q": "IGBT的驱动方式与驱动功率特点是：", "opts": ["电流驱动、驱动功率大", "电流驱动、驱动功率小", "电压驱动、驱动功率小", "电压驱动、驱动功率大"], "ans": "C", "points": "IGBT与功率MOSFET为电压驱动、驱动功率小；SCR、GTR为电流驱动、驱动功率大。额定电流密度VMOS/IGBT为50~100A/cm²最高。"}, {"tag": "体积小原理", "q": "逆变弧焊电源体积小、重量轻的根本原因是：", "opts": ["改用铜导线", "减小了焊接电流", "取消了变压器", "工作频率高，变压器体积重量与频率成反比（U∝fNSBm，中频使铁心截面与匝数大幅减小）"], "ans": "D", "points": "变压器电势公式U=4.44fNΦm（Bm为磁通密度、S为铁心截面、N为匝数），频率由50Hz提高到20kHz（400倍），铁心截面S和匝数N大幅减小→变压器体积重量急剧下降。"}, {"tag": "高效节能", "q": "逆变弧焊电源（ZX7/IGBT）相对旋转式弧焊发电机（AX7-400）的典型效率与功率因数对比为：", "opts": ["效率90%→53%，功率因数0.95→0.55", "效率与功率因数不变", "效率100%", "效率53%→90%以上，功率因数0.55→0.95以上"], "ans": "B", "points": "表6-2：AX7-400效率53%→ZX7-400（IGBT）≥90%；cosφ从0.55提高到≥0.95；重量从370kg降至约33kg。"}, {"tag": "控制周期", "q": "逆变弧焊电源（20kHz）的控制周期约为50μs，而双反星形晶闸管整流器的控制周期为3.33ms，其意义是：", "opts": ["动态响应快百倍，可有效控制短路过渡等快速过程，控制精度高", "只能用于直流焊", "输出波动更大", "控制更慢"], "ans": "C", "points": "控制周期越短，对外界扰动和电弧状态变化的响应越快（约快两个数量级），可实现精细的波形控制、恒流恒压快速切换。"}, {"tag": "单端正激", "q": "单端正激逆变电路（双管箝位式）的特点是：", "opts": ["不需复位绕组", "变压器单向磁化，需磁通复位，双管箝位可抑制尖峰电压，用于中小功率", "变压器双向磁化", "功率最大"], "ans": "D", "points": "单端正激变压器单向磁化、需磁复位；双管箝位式用两只开关管+箝位二极管抑制尖峰，用于中小功率焊机；并联双单端可增大功率。"}, {"tag": "推挽电路", "q": "推挽逆变电路中，开关管承受的电压为电源电压的：", "opts": ["2倍（2Ud）", "0.5倍", "4倍", "1倍"], "ans": "C", "points": "推挽电路两管交替工作、变压器单边工作，截止管承受2Ud电压，耐压要求高、利用率低，只用于中小功率、少用。"}, {"tag": "半桥电路", "q": "半桥逆变电路的特点与应用代表机型是：", "opts": ["两电容分压、抗不平衡能力强，中小功率，KEMPPI（肯比）MASTER350", "四管全桥、功率最大", "只能小电流", "无电容"], "ans": "A", "points": "半桥电路由两个电容分压，两管交替导通，抗不平衡能力强，用于中小功率（KEMPPI MASTER350）；全桥四管、输出功率最大（米勒XMT-300）。"}, {"tag": "TRC方式", "q": "TRC（时间比控制）中，PWM方式是：", "opts": ["定脉宽、改变频率", "频率脉宽同时变", "改变输入电压", "定频率、改变脉冲宽度"], "ans": "B", "points": "PWM（脉冲宽度调制）：定频调宽，输出脉宽变→平均电压变；PFM（脉冲频率调制）：定宽调频；PWM+PFM为两者混合。"}, {"tag": "SG3525", "q": "SG3525在逆变弧焊电源控制电路中的作用是：", "opts": ["输出滤波", "整流控制", "产生PWM控制信号（振荡、误差放大、比较、驱动输出）的集成控制器", "逆变主开关"], "ans": "A", "points": "SG3525是集成PWM控制器，内含振荡器、误差放大器、PWM比较器与输出驱动，产生两路互补PWM信号控制逆变开关管。"}], "fill": [{"tag": "逆变定义", "q": "逆变是将____电变换为____电的过程，逆变弧焊电源输出的焊接电流本质为____（直流/交流）。", "ans": ["直流", "交流", "直流"], "points": "逆变=DC→AC；弧焊逆变电源先整流→逆变（中频交流）→变压器→整流输出直流（或再逆变输出方波交流）。"}, {"tag": "按器件分类", "q": "逆变式弧焊电源按开关器件分为____型、____型、____型和____型四类。", "ans": ["SCR（晶闸管）", "GTR（大功率晶体管）", "VMOS（功率场效应管）", "IGBT（绝缘栅双极晶体管）"], "points": "四类对应逆变电源的发展阶段：SCR逆变器→GTR→VMOS→IGBT，IGBT综合性能最优。"}, {"tag": "器件参数", "q": "开关速度：SCR为____μs、GTR为____μs、VMOS为____μs、IGBT为____μs。", "ans": ["25~100", "1~5", "0.1~0.5", "0.5~1"], "points": "额定电流密度：SCR/GTR为20~30/5~10A/cm²、VMOS/IGBT为50~100A/cm²；驱动：SCR/GTR电流驱动功率大、VMOS/IGBT电压驱动功率小。"}, {"tag": "四大特点", "q": "逆变弧焊电源的四大特点是：体积小重量轻、____节能、____特性好控制灵活、对元器件要求高电路复杂。", "ans": ["高效", "动态"], "points": "体积小（U∝fNSBm中频化）、高效节能（效率≥90%、cosφ≥0.95）、动特性好（控制周期50μs）、电路复杂要求高（du/dt、di/dt易击穿）。"}, {"tag": "变压器原理", "q": "变压器电势公式____表明，提高工作频率可成比例减小变压器铁心截面与匝数。", "ans": ["U=4.44fNΦm（U∝fNSBm）"], "points": "中频化是逆变电源体积小的根本原因：50Hz→20kHz，体积重量降约一个数量级。"}, {"tag": "逆变电路分类", "q": "按电路结构，逆变器分为____（双管箝位/并联双单端）、____、____和____四种。", "ans": ["单端正激", "推挽", "半桥", "全桥"], "points": "单端正激中小功率；推挽2Ud利用率低少用；半桥两电容分压、抗不平衡强、中小功率（KEMPPI MASTER350）；全桥4管、磁滞回线双侧利用率高、大功率（米勒XMT-300）、抗不平衡差。"}, {"tag": "TRC", "q": "时间比控制TRC分三种：____（定频调宽）、____（定宽调频）和____。", "ans": ["PWM", "PFM", "PWM+PFM"], "points": "PWM定频调脉宽；PFM定脉宽调频率；PWM+PFM混合控制，用于改善调节性能。"}, {"tag": "输入整流滤波", "q": "逆变电源输入侧电路一般包括____（吸收电网过压）、____（限制启动冲击电流）和整流滤波电路。", "ans": ["压敏电阻", "软启动（启动限流）"], "points": "输入整流滤波：压敏电阻吸收过压→整流桥→软启动（限流电阻+继电器）→滤波电容；输出侧整流二极管需注意反向恢复。"}]}], "part3": [{"ch": 1, "title": "第一章 弧焊电源绪论与基本要求", "sa": [{"tag": "弧焊电源与普通电源", "q": "弧焊电源与一般电源有何不同？为什么说电弧是弧焊电源的特殊负载？", "points": "一般电源向普通负载供电，负载多为线性电阻；弧焊电源向焊接电弧供电，而焊接电弧是特殊负载：①非线性负载，电弧电压与电流不成正比；②低电压（20~80V）、大电流（30~1500A）；③负载变化大，焊接过程中经常出现“短路—空载—燃弧”状态转换；④电弧特性与焊接方法、电弧状态、周围介质及电极材料密切相关。因此弧焊电源必须具有特殊的外特性、调节特性和动态特性。"}, {"tag": "对电源的基本要求", "q": "弧焊工艺对弧焊电源提出了哪些基本要求？", "points": "①保证引弧容易：需要足够高的空载电压和合适的短路电流；②保证电弧稳定：电源—电弧系统稳定，外特性与电弧静特性配合恰当；③保证焊接工艺参数稳定：焊接电流、电弧电压在受干扰时波动小；④具有足够宽的焊接参数调节范围：能输出一组可调的外特性曲线，满足不同工艺方法、不同规范的要求。"}, {"tag": "三大特性与稳定燃烧", "q": "弧焊电源的外特性、调节特性、动态特性分别满足电弧稳定燃烧的什么要求？", "points": "①外特性：满足电弧静态稳定燃烧的要求——稳态下电源输出电压与电流的关系要与电弧静特性正确配合，保证系统稳定；②调节特性：满足不同“强度”电弧稳定燃烧的要求——通过调节外特性曲线族选择合适的工作点，获得所需焊接电流与电压；③动态特性：满足电弧动态稳定燃烧的要求——电弧负载瞬态变化（如短路过渡）时，输出电压电流能快速、合理地响应。"}, {"tag": "外特性与静特性配合", "q": "为什么说焊接电弧不工作在静特性曲线的下降段？", "points": "电弧静特性呈U形，分为下降段、水平段、上升段。若工作点在下降段：当电流增大时电弧电压也增大（若电源外特性配合不当），会出现“右源高”的不稳定情况——电流增大→电源电压大于电弧电压→电流继续增大，形成正反馈，系统不稳定。下降段电弧燃烧不稳定，因此各焊接方法均使用水平段或上升段（如焊条电弧焊用水平段、细丝气保焊用上升段）。"}, {"tag": "分类总述", "q": "弧焊电源有哪些主要分类方法？各分哪几类？", "points": "①按主电路结构：弧焊变压器、弧焊整流器、弧焊逆变器；②按外特性形状：下降特性（斜缓、缓降、恒流、恒流带外拖）、平特性（恒压、平缓）、双阶梯特性；③按输出电流种类：交流、直流、脉冲；④按控制方式：机械调节型、电磁控制型、电子控制型。各类电源的适用焊接方法与工艺要求不同。"}, {"tag": "焊接方法与外特性", "q": "简述常用焊接方法对弧焊电源外特性的要求（焊条电弧焊、等速送丝气保焊、变速送丝埋弧焊、TIG）。", "points": "①焊条电弧焊：电弧在水平段，要求恒流为主加短路外拖（恒流带外拖），保证引弧容易、熔滴过渡顺畅；②等速送丝熔化极气体保护焊（MIG/CO2/MAG、细丝埋弧焊）：电弧工作在上升段，靠电弧自身调节，用平或缓降外特性；③变速送丝埋弧焊（粗丝）与部分MIG：电弧在水平段、自调节作用弱，用弧压反馈变速送丝，电源用陡降（恒流）外特性；④非熔化极焊（TIG/PAW）：要求电流稳定，用恒流特性（可加短路内拐）。"}]}, {"ch": 2, "title": "第二章 弧焊电源基本电气特性", "sa": [{"tag": "接触与非接触引弧", "q": "比较接触引弧与非接触引弧的原理及应用场合。", "points": "接触引弧：电极与工件接触短路，接触点面积小、电流密度大，电阻热使金属熔化汽化，引起热发射和热电离；拉开时发生强场发射，带电质点加速碰撞引起碰撞电离，并进一步光电离和热电离，维持电弧稳定燃烧。用于焊条电弧焊、埋弧焊、CO2焊等。\n非接触引弧：用高电压击穿间隙使电弧引燃，有高频高压引弧（150~250kHz、2000~3000V）和高压脉冲引弧（50或100Hz、3000~5000V）两种，用于钨极氩弧焊（TIG）和等离子弧焊（PAW），避免钨极接触污染。"}, {"tag": "电弧静特性与焊接方法", "q": "什么是电弧静特性？不同焊接方法各工作在静特性的哪一段？", "points": "电弧静特性：一定长度的电弧在稳定状态下，电弧电压Uf与电流If的关系Uf=f(If)，曲线呈U形（下降段、水平段、上升段）。\n①焊条电弧焊（SMAW）、埋弧焊（SAW）：水平段；②非熔化极气体保护焊（TIG）、微束等离子弧焊（PAW）：水平段，大电流时上升段；③细丝熔化极气体保护焊（GMAW）和水下焊接：上升段。下降段电弧燃烧不稳定，实际不使用。"}, {"tag": "系统稳定条件", "q": "说明“电源—电弧”系统稳定条件及其物理本质。", "points": "条件：电源外特性Uy=f(Iy)与电弧静特性Uf=f(If)有交点A0，且交点的左边Uy>Uf（源高），交点的右边Uy\u003cUf（源低）；也可用稳定系数Kw=-(∂Uf/∂I-∂Uy/∂I)|If>0表示，Kw越大稳定性越高。\n物理本质：电源能根据电弧的需要自动调整能量输出，类似于有电流负反馈作用——电流偏大时电源电压低于电弧电压使电流回落，电流偏小时电源电压高于电弧电压使电流回升。"}, {"tag": "外特性区段功能", "q": "弧焊电源外特性曲线各工作区段（空载点、工作区段、短路区段、外拖拐点）的功能是什么？", "points": "①空载点：决定电源空载电压U0，影响引弧与稳弧性能；②工作区段：反映外特性曲线的具体形状，用于正常焊接阶段，决定焊接电流电压的稳定工作点；③短路区段：反映曲线形状和短路电流值Iwd，影响短路引弧及熔滴过渡；④外拖拐点：从工作段进入外拖段的转折点，外拖段用于提供足够短路电流，改善引弧和熔滴过渡（如恒流带外拖）。"}, {"tag": "负载持续率换算", "q": "什么是负载持续率？实际负载持续率与额定负载持续率不同时，允许输出电流如何换算？", "points": "负载持续率FS=负载持续运行时间/(负载持续运行时间+休止时间)×100%=t/T×100%，反映电源工作负载的断续程度（决定温升）。\n弧焊电源常工作在非额定负载持续率状态，实际允许最大输出电流按If=Ie·√(FSe/FS)换算：Ie为额定电流，FSe为额定负载持续率，FS为实际负载持续率。负载持续率越低，允许输出电流越大。"}, {"tag": "动特性与短路过渡", "q": "弧焊电源的动特性是什么？短路过渡焊接对其有何要求？", "points": "动特性：电弧负载状态发生瞬态变化时，电源输出电压与电流的响应特性，表明电源对电弧负载瞬变的适应能力，用瞬时值uy=f(t)、iy=f(t)描述。\n短路过渡（如细丝CO2焊）中电弧不停地在空载—短路—负载三态转换，频率高，对动特性要求高：①限制瞬时短路电流峰值（焊条电弧焊Isd/I2≤3.0、Ifd/I2≤2.5）；②控制短路电流上升率di/dt——过小熔滴难过渡、焊丝成段爆断，过大瞬间达峰值产生严重小颗粒飞溅；推荐值：焊丝0.8mm为50~150、1.2mm为40~130、1.6mm为20~75 kA/s。"}]}, {"ch": 3, "title": "第三章 弧焊变压器", "sa": [{"tag": "外特性方程推导", "q": "写出弧焊变压器带纯电阻负载时的简化外特性方程并说明各量含义，为什么外特性呈下降形？", "points": "简化方程 Uf=U0−IfXk，其中Uf为电弧电压（输出端电压），U0为空载电压，If为输出电流，Xk为变压器等效感抗（含漏抗和串联电抗器感抗）。\n外特性下降的原因：输出回路串联大感抗Xk，电流流过时产生较大的感抗压降IfXk，输出电压随电流增大而线性降低，从而获得下降外特性，保证电弧在水平段稳定燃烧、短路电流受到限制。考虑绕组电阻时外特性为椭圆方程。"}, {"tag": "三种增强漏磁比较", "q": "比较动铁心式、动绕组式、抽头式三种增强漏磁弧焊变压器的结构与调流特点。", "points": "①动铁心式（BX1）：在固定铁心中间插入可动铁心，移动动铁心改变气隙δ→耦合系数kM与漏抗XfL变化→电流连续可调，矩形铁心调节范围大（75~400A）、能实现小电流，梯形铁心调节范围窄；\n②动绕组式（BX3）：二次绕组可摇动，改变一二次绕组间距δ12→漏抗XZL=K·N2²(δ12+A)变化→电流细调；二次绕组两段串/并联实现有级粗调，调节范围大、电流调节下限可很小；\n③抽头式（BX6）：一次绕组设抽头，改变重合率λ=N12/N1→漏抗XL=K(1−λ)N2²变化→电流有级调节，结构简单、省料轻便，但只能有级调节、负载持续率低（约10%）。"}, {"tag": "分体与同体", "q": "串联电抗器式弧焊变压器中分体式与同体式各有何特点？", "points": "分体式（BP-3×500等）：电抗器与主变压器各用独立铁心，经导线连接。特点：铁心利用率低、材料消耗大、占地大，但两器件可分开布置（如固定式焊机），调节气隙方便。\n同体式（BX2等）：电抗器与变压器做成同一铁心（共用磁路），结构紧凑、铁心利用率高、节约材料，用于较大容量焊机。两者均靠调节电抗器气隙δ改变感抗Xk→改变电流。"}, {"tag": "为什么用感抗不用电阻", "q": "为什么弧焊变压器要依靠感抗而不是电阻获得下降外特性？", "points": "①电阻会消耗有功功率、发热严重、降低效率，而电抗只产生无功压降，损耗小；②电阻外特性是直线且短路电流大，不易限制；感抗压降随电流增大而增大，能自然形成缓降的下降特性并限制短路电流；③感抗可以方便地通过改变气隙、绕组匝数或间距连续/有级调节，实现焊接电流调节；④电感还储存磁能，有助于交流电弧过零后的再引弧，改善电弧稳定性。"}, {"tag": "型号识别", "q": "解释BX1-300、BX3-300、BX6-140型号中各符号的含义。", "points": "第一个字母B=弧焊变压器；第二个字母X=下降外特性；数字1=动铁心式、3=动绕组式、6=抽头式（2=串联电抗器同体式、没有标注时为分体式）；横杠后数字=额定焊接电流（A）。\n故BX1-300为额定电流300A的动铁心式下降特性弧焊变压器；BX3-300为额定300A动绕组式；BX6-140为额定140A抽头式（调节范围35~190A、负载持续率10%）。"}, {"tag": "动铁心调流原理", "q": "动铁心式弧焊变压器如何实现焊接电流的调节？矩形与梯形铁心有何区别？", "points": "原理：可动铁心与固定铁心间形成附加漏磁路。移动可动铁心→气隙δ变化→漏磁通与附加漏抗XfL≈μ0N²Sδ/δ变化→等效感抗变化→外特性平移、焊接电流改变：δ增大漏抗减小电流增大，δ减小漏抗增大电流减小。\n矩形铁心：δ变化范围大，可获得大电流调节范围、实现小电流下限（BX1-300：75~400A），结构较复杂；梯形铁心：δ变化范围小、调节范围窄，结构简单，用于小容量焊机。"}]}, {"ch": 4, "title": "第四章 电子控制弧焊电源基础", "sa": [{"tag": "反馈组合与特性", "q": "说明外特性控制电路中四种反馈组合方式（只取电压、只取电流、同时、分时）各得到什么外特性。", "points": "①只取电压负反馈Uk=K3K1(Ugu−mUf)：输出电压基本不变→平特性（恒压特性），用于等速送丝气保焊；②只取电流负反馈Uk=K3K2(Ugi−nIf)：输出电流基本不变→陡降（恒流）特性；③电压电流同时负反馈：外特性为斜线，斜率由电压、电流反馈强度比例决定，可做成缓降特性；④分时负反馈（陡降带外拖）：正常段（输出>阈值Uth=8~15V）取电流负反馈为陡降恒流段，短路段（\u003cUth）切到电压反馈得到低电压大电流外拖段，改善引弧和短路过渡。恒压+电流截止组合：电压反馈为主保证恒压，电流超限后电流反馈截止限制短路电流。"}, {"tag": "霍尔传感器比较", "q": "比较取样电阻、直测式霍尔传感器与LEM磁平衡式电流传感器的原理与特点。", "points": "①取样电阻（分流器）：电流流过小电阻取电压信号Ufi=nIf，简单廉价，但损耗功率、隔离差（需与主回路共地），只适用于中小电流；\n②直测式霍尔传感器：霍尔片置于磁场中，UH=KH·IB/d（毫伏级需放大）。无惯性、响应快、隔离好、能防磁干扰，但输入需恒流源；\n③LEM磁平衡式：副边补偿电流Is产生的磁场与原边电流Id磁场相平衡，IsNs=IdNd，输出信号经放大驱动补偿电流。反应时间约1μs、线性度好、抗干扰强、可测任意波形（直流/交流/脉冲），价格较高；电压传感器则一次侧经电阻把电压转成电流后测量。"}, {"tag": "调节特性", "q": "电子控制型弧焊电源的调节特性是如何实现的？与机械调节式有何本质区别？", "points": "电子控制型通过调节给定电压Ugi/Ugu实现：增大Ugi→外特性曲线右移→焊接电流增大（调节电流）；增大Ugu→外特性曲线上移→输出电压升高（调节电压）。外特性形状由反馈网络决定，调节轻便、可在焊接过程中进行。\n机械调节型（弧焊变压器/整流器）通过改变电抗器气隙、绕组位置等机械结构改变等效内阻抗r0来实现调节，调节范围受结构限制、一般需停电调节。本质区别：前者调节的是给定信号（电调节），后者调节的是等效内阻抗（结构调节）。"}, {"tag": "稳压电源选用", "q": "比较78XX/79XX固定稳压器与LM317/LM337可调稳压器，并说明TL431的作用。", "points": "78XX系列：固定正电压输出（7805=+5V、7812=+12V等），79XX系列固定负电压（7905=-5V），使用简单、有内部过热与过流保护，要求输入电压高于输出电压2V以上（UI>Uo+2V）；\nLM317/LM337：三端可调输出（1.25~35V），外接两个电阻调压，用于需要非标准电压的场合；\nTL431/LM336：精密基准电压源（TL431为2.5V基准可调），用作给定电压源或A/D基准，温漂小、精度高，提高控制电路给定电压的稳定性。"}, {"tag": "电子电抗器", "q": "什么是电子电抗器？它是如何实现焊接电流动态控制的？", "points": "电子电抗器是用电子电路（积分电路）模拟电感特性的装置，用于控制焊接电流的上升率（di/dt）。\n原理：控制信号经积分电路处理，使输出电流If∝∫(Ugu−mUf)dt，电流按积分规律（斜坡）上升；改变积分时间常数即可等效改变电感量，实现di/dt控制。与真实电感相比，体积小、电感值可方便调节，且在短路电流上升过程中可避免瞬时冲击，改善短路过渡质量。"}, {"tag": "STT波形控制", "q": "分析短路过渡飞溅的成因，说明STT（表面张力过渡）波形控制各阶段的策略。", "points": "飞溅成因：①短路初期，接触处电流密度大、电磁收缩力Fcz∝I²急剧增大，产生排斥瞬时飞溅；②短路末期缩颈处电流密度高、电磁收缩力强，大电流下液桥爆断，产生细颗粒飞溅。表面张力Fσ=2πrσ始终促进熔滴铺展、阻碍爆断。\nSTT控制策略：①短路初期迅速降低电流，抑制电磁收缩力、防止瞬时飞溅；②短路中期适当增大电流促进熔滴铺展与缩颈形成；③缩颈末期检测到电压变化即降低电流，靠表面张力自然拉断液桥，避免爆断飞溅；④燃弧期按分段恒流控制，稳定电弧能量与焊缝成形。"}]}, {"ch": 5, "title": "第五章 晶闸管式弧焊整流器", "sa": [{"tag": "四种主电路比较", "q": "比较三相半控桥、三相全控桥、六相半波、双反星形四种晶闸管整流主电路的特点（晶闸管数、输出电压、脉动、每管承担电流）。", "points": "①三相半控桥：3只晶闸管（3只二极管），Ud=1.17U2(1+cosα)，3次脉动，每管承担1/3负载电流，元件少、简单，但脉动大、触发与自然换相点重合、移相0~180°；\n②三相全控桥：6只晶闸管，Ud=2.34U2cosα，6次脉动（波形平缓），每管承担1/3，触发脉冲互差60°（双窄/单宽），电阻负载移相0~120°（60°临界连续）、电感负载0~90°；米勒、ZX5-400B采用；\n③六相半波：6只管、每管导通60°、触发频率300Hz、Ud=1.35U2cosα、移相0~90°（电感负载），每管承担1/6、散热好、利用率低，林肯DC-600采用；\n④双反星形：两组三相半波经平衡电抗器并联，6只管、每管导通120°、承担1/6、输出6波峰、Ud=1.17U2cosα，需平衡电抗器LB（幅值约1/2相电压幅值、三倍频三角波），临界电流约额定2%~5%，适合大电流焊机（ZX5系列）。"}, {"tag": "平衡电抗器", "q": "双反星形整流电路为什么必须加平衡电抗器？其工作原理与临界电流如何？", "points": "两组三相半波整流电源并联时，若不采取措施，任一时刻只有电压较高的一组导通（单组工作），每组每管导通120°、电流利用率低、变压器铁心利用率差。加入平衡电抗器LB后，LB两端的电压差使两组管子同时导通：任一瞬时两组输出电压瞬时值不同，LB吸收其差值电压，使两组整流器并联输出；两组管子交替工作、每管导通120°、各承担1/6负载电流。\n平衡电抗器电压为三倍频三角波、幅值约1/2相电压幅值，其电感需满足最小负载电流要求L≥2.24U/Idmin。当负载电流小于临界电流（约额定电流的2%~5%）时，LB失去平衡作用，电路转为六相半波工作。"}, {"tag": "触发电路要求", "q": "晶闸管弧焊整流器对触发电路有哪些要求？ZX5系列为什么只需两套触发电路？", "points": "要求：①触发脉冲有足够功率（2~4V、50~200mA）能可靠触发；②与主电路同步（触发脉冲与阳极电压同相位）；③移相范围足够（覆盖所要求的工作范围）；④脉冲前沿陡、宽度合适（全控桥需双窄或单宽脉冲）。\nZX5系列主电路为双反星形：两组晶闸管分别为共阳极组和共阴极组，同相晶闸管可共用一个触发电路，故只需两套触发电路（分别触发两组管子）；ZDK-500六套、三相半控桥一套（同相触发）等套数安排取决于主电路结构。"}, {"tag": "单结晶体管原理", "q": "简述单结晶体管的结构、特性及其在触发电路中的作用。", "points": "单结晶体管（双基极二极管）：只有一个PN结，发射极e、两个基极b1、b2。特性：当发射极电压UE低于峰点电压Up时管子截止；达到Up后进入负阻区（eb1间电阻骤降）；降至谷点电压Uv后恢复截止，呈负阻特性。\n张弛振荡器：电源经电阻给电容充电，电容电压升至Up→管子导通→电容经eb1迅速放电→在b1输出尖脉冲（触发脉冲）→放至Uv管子截止→重新充电，循环产生脉冲列。移相控制通过改变充电电阻实现，用于晶闸管触发；同步则通过把电源同步电压接入振荡器保证脉冲与主电路同相。"}, {"tag": "ZX5系列特点", "q": "ZX5系列晶闸管弧焊整流器（ZX5-250/400/630）的主电路、触发与控制特点是什么？", "points": "主电路：带平衡电抗器的双反星形晶闸管整流，适合大电流输出；每管承担1/6负载电流，变压器与晶闸管利用率高、散热好。\n触发电路：两套移相触发电路（共阳极组与共阴极组各一套），触发脉冲互差120°，与主电路同步。\n控制：采用电流负反馈实现下降（恒流）外特性，电流可调；设置引弧推力电路——焊接时短路/引弧瞬间提供附加电流（外拖），保证引弧容易、短路过渡顺畅，减少飞溅；外特性通过给定电压调节实现电流范围调节（ZX5-250为25~250A等）。"}, {"tag": "晶闸管整流器与变压器比较", "q": "与弧焊变压器相比，晶闸管弧焊整流器在性能上有哪些优势？", "points": "①输出直流电，引弧容易、电弧稳定（无交流过零再引弧问题），空载电压可降低；②控制性好：通过电子反馈可方便地获得平、陡降、恒流带外拖等多种外特性形状，满足不同焊接方法要求，且可在焊接过程中连续调节；③动特性好：可配合电子电抗器等改善短路过渡，减少飞溅；④省材节能：无旋转机组（对比弧焊发电机），效率高、噪声小、体积小、寿命长。\n缺点是电路较复杂、维修要求高、对晶闸管耐压与散热要求高。"}]}, {"ch": 6, "title": "第六章 逆变式弧焊电源", "sa": [{"tag": "逆变工作原理", "q": "说明逆变式弧焊电源的工作原理（AC-DC-AC-DC形式）及各环节的作用。", "points": "工作原理：电网工频交流→输入整流滤波（AC→DC：整流桥整流+电容滤波，得到平滑直流）→逆变器（DC→AC：开关管按20kHz左右高频通断，把直流斩成中频方波交流）→中频变压器（降压：由于频率高，变压器铁心截面与匝数大幅减小，体积重量很小）→输出整流滤波（AC→DC：快恢复二极管整流+电感电容滤波，得到平滑焊接直流输出）。\n闭环控制：输出电流/电压经反馈与给定比较，误差信号送入PWM控制器（SG3525）调节脉宽→稳定输出并形成所需外特性。控制周期约50μs，动态响应快。"}, {"tag": "逆变四大特点", "q": "逆变式弧焊电源有哪些主要特点？分别说明其成因。", "points": "①体积小、重量轻：工作频率高（50Hz→20kHz），变压器电势U∝fNSBm，铁心截面与匝数成比例减小，变压器、电感体积重量大幅下降；\n②高效节能：中频变压器铁损铜损小、励磁电流小，开关管工作在开关状态功耗低，效率≥90%（AX7-400为53%）、功率因数≥0.95（0.55），节电显著；\n③动特性好、控制灵活：控制周期50μs（双反星形3.33ms），对短路过渡等快速过程响应快，可实现恒流恒压快速切换、精细波形控制；\n④对元器件要求高、电路复杂：高频开关产生高du/dt、di/dt，易造成器件击穿损坏，需软开关、吸收电路与可靠的保护，对元件和工艺要求高。"}, {"tag": "四种逆变电路比较", "q": "比较单端正激、推挽、半桥、全桥四种逆变电路的结构特点与适用范围。", "points": "①单端正激（双管箝位式）：变压器单向磁化、需磁通复位（复位绕组或双管箝位箝制尖峰），两管交替或并联双单端，用于中小功率焊机；\n②推挽：两只开关管交替导通、变压器原边单边工作，截止管承受2Ud电压，利用率低，耐压要求高，中小功率、少用；\n③半桥：两个电容分压构成中点，两管交替导通，抗不平衡能力强、变压器双向磁化利用率较高，用于中小功率（KEMPPI MASTER350）；\n④全桥：四只开关管、对角交替导通，变压器磁滞回线双侧工作、利用率最高，输出功率最大，但抗不平衡能力差、需防止直通，用于大功率焊机（米勒XMT-300）。"}, {"tag": "TRC控制", "q": "什么是TRC？PWM、PFM、PWM+PFM三种时间比控制方式有何区别？", "points": "TRC（时间比控制）：通过控制开关管通断时间比（占空比）调节输出平均电压的控制方式。\n①PWM（脉冲宽度调制）：开关频率固定，改变脉冲宽度（占空比）→输出电压改变。特点：频率恒定，输出滤波设计简单、谐波固定，应用最广（SG3525实现）；\n②PFM（脉冲频率调制）：脉冲宽度固定，改变开关频率→输出电压改变。特点：轻载时频率升高、噪声与滤波困难，少用；\n③PWM+PFM：脉宽与频率同时调节，兼顾调节范围与动态性能，用于需要宽范围调节的场合。"}, {"tag": "外特性控制", "q": "逆变式弧焊电源的外特性是如何形成的？调节特性如何实现？", "points": "外特性形成：逆变电源输出经高频变压器与输出整流后为电压源性质，通过闭环反馈控制形成所需外特性——取输出电压反馈并经误差放大器控制PWM脉宽，使输出电压恒定→平特性；取输出电流反馈→恒流（陡降）特性；电压电流反馈组合→斜线、恒流带外拖等形状，可方便切换与分段控制（如恒流段+外拖段）。\n调节特性：调节给定电压Ug——Ug上下移动（平动）时外特性曲线上/下平移，调节输出电压；Ug左右移动（降动）时改变电流给定，外特性左/右平移，调节焊接电流。注意：在高频PWM基础上，Ug的低频调制须经更高频PWM环节实现（即给定电压最终通过改变PWM脉宽起作用）。"}, {"tag": "整流与保护", "q": "逆变弧焊电源输入整流滤波与输出整流滤波电路有哪些要点？为什么强调保护？", "points": "输入整流滤波：①压敏电阻吸收电网浪涌过电压；②软启动电路（启动时串限流电阻，电容充电完成后继电器短接）限制启动冲击电流，防止冲击损坏整流桥与滤波电容；③整流桥+大电容滤波得平滑直流。\n输出整流滤波：中频交流经快恢复二极管（注意反向恢复特性，开关频率高要求恢复时间短）整流，再经电感电容滤波得平滑直流焊接电流。\n保护要点：高频开关产生高du/dt、di/dt，可能使开关管误导通或过压击穿；逆变桥上下管直通会烧毁器件，需设置死区时间、过流/过压/过热保护电路、吸收（缓冲）网络等，保证可靠运行。"}]}], "appendix": [{"title": "课后思考与作业（课程PPT对应内容）", "items": [["什么是弧焊电源？它在电弧焊机中起什么作用？", "弧焊电源是向焊接电弧提供电能的装置，是电弧焊机的核心部分。作用：把电网380V/50Hz电能变换为焊接电弧所需的低压大电流电能（约20~80V、30~1500A），并满足引弧容易、电弧稳定、工艺参数稳定、调节范围宽四项基本要求，保证焊接质量与效率。"], ["弧焊电源有哪些分类方法？", "按主电路结构：弧焊变压器、弧焊整流器、弧焊逆变器；按外特性形状：下降特性（斜缓/缓降/恒流/恒流带外拖）、平特性（恒压/平缓）、双阶梯特性；按输出电流种类：交流、直流、脉冲；按控制方式：机械调节型、电磁控制型、电子控制型。"], ["为什么电弧是弧焊电源的特殊负载？", "①非线性负载，电弧电压与电流不成正比（静特性U形曲线）；②低电压大电流；③负载变化大，焊接中经常出现短路—空载—燃弧三态转换，且转换频繁、频率高。因此弧焊电源必须有特殊的外特性、调节特性与动态特性与之配合。"], ["解释SMAW、GMAW、TIG的含义并说明各自对电源外特性的要求。", "SMAW=焊条电弧焊（Shielded Metal Arc Welding）：电弧在静特性水平段，用恒流（下降）特性并带短路外拖；GMAW=熔化极气体保护焊（Gas Metal Arc Welding）：细丝工作在上升段，等速送丝时用平或缓降特性靠自调节；TIG=钨极（非熔化极）惰性气体保护焊：要求电流稳定，用恒流特性，可加短路内拐。"], ["弧焊电源按外特性形状如何分类？各适用于哪些焊接方法？", "下降特性：焊条电弧焊（恒流带外拖）、TIG（恒流）、变速送丝埋弧焊（陡降）；平特性：等速送丝熔化极气保焊（MIG/MAG/CO2）、细丝埋弧焊；双阶梯特性：脉冲焊（脉冲TIG、脉冲MIG）。"]]}, {"title": "课后思考与作业（课程PPT对应内容）", "items": [["接触引弧的物理过程如何？", "电极与工件接触短路→接触点面积小、电流密度大→电阻热使金属熔化汽化→引起热发射和热电离→电极拉开时发生强场发射、碰撞电离→带电质点加速、碰撞电离持续→形成电弧并稳定燃烧。"], ["为什么交流电弧比直流电弧难以稳定燃烧？应采取哪些措施？", "交流电流每周期过零100次，过零时电弧熄灭，需要足够的再引弧电压才能重新燃弧；电流反向期间电源电压与电弧电压方向相反，若电压不足电弧中断。措施：①提高空载电压（U0＞(1.8~2.25)Uf，交流手弧焊55~70V）；②回路串联电感使电流滞后电压，过零后半个波电压较高时即再引弧；③改善波形（如方波交流）减小过零停留时间。"], ["一台额定电流Ie=500A、额定负载持续率60%的弧焊电源，在100%负载持续率下允许输出的最大电流是多少？", "If=Ie·√(FSe/FS)=500×√(0.6/1.0)=500×0.7746≈387.3A。即100%连续负载时最大输出约387.3A（低于额定电流，防止过热）。"], ["电源—电弧系统稳定燃烧的条件是什么？", "电源外特性与电弧静特性两曲线有交点，且交点左边电源电压大于电弧电压（Uy>Uf）、交点右边电源电压小于电弧电压（Uy\u003cUf），即“左源高、右源低”；用稳定系数Kw=-(∂Uf/∂I-∂Uy/∂I)|If表示，Kw>0系统稳定，Kw越大越稳定。"], ["弧焊电源的空载电压应如何确定？有哪些数值要求？", "原则：U0＞(1.8~2.25)Uf保证交流电弧稳定燃烧，同时兼顾安全。数值：交流手工电弧焊55~70V、交流埋弧焊70~90V；直流电源引弧较易，可降低约10V；弧焊变压器不超过80V，整流器、逆变器不超过85V。"], ["什么是约定负载特性？各焊接方法的表达式如何？", "约定负载特性是标准规定的电源输出电压与输出电流的关系，用于设计校核：SMAW：U2=20+0.04I2；TIG：U2=10+0.04I2；MIG/MAG与平特性埋弧焊：U2=14+0.05I2（均限I2≤600A）。"]]}, {"title": "课后思考与作业（课程PPT对应内容）", "items": [["弧焊变压器为什么能获得下降外特性？写出简化外特性方程。", "输出回路中串联足够大的感抗（电抗器或增强漏磁形成的等效感抗Xk），电流流过时产生感抗压降，输出电压随电流增大而下降。简化外特性方程：Uf=U0−IfXk（带纯电阻负载）；考虑绕组电阻时为椭圆方程。"], ["弧焊变压器按获得下降外特性的方法分为哪两类？各有哪些形式？", "①串联电抗器式：分体式（BP-3×500，电抗器独立铁心）与同体式（BX2，共用铁心）；②增强漏磁式：动铁心式（BX1）、动绕组式（BX3）、抽头式（BX6）。"], ["动铁心式弧焊变压器如何调节焊接电流？矩形与梯形铁心有何区别？", "移动可动铁心改变与固定铁心的气隙δ→耦合系数kM与附加漏抗XfL≈μ0N²Sδ/δ变化→等效感抗变化→外特性平移、电流改变（δ增大漏抗减小电流增大）。矩形铁心δ变化范围大、调节范围大、可实现小电流下限（BX1-300：75~400A）；梯形铁心δ变化小、调节范围窄、结构简单，用于小容量焊机。"], ["增强漏磁的三种方式如何实现电流调节？", "①动铁心：移动铁心改变气隙（连续）；②动绕组：移动二次绕组改变一二次间距δ12（细调）+二次绕组串并联（粗调）；③抽头：改变重合率λ=N12/N1（有级调节）。三者都是通过改变变压器漏抗实现电流调节。"], ["解释型号BX1-300、BX3-300、BX6-140的含义。", "B=弧焊变压器；X=下降外特性；数字1=动铁心式、3=动绕组式、6=抽头式（2=串联电抗器同体式）；末尾数字=额定焊接电流(A)。故：BX1-300为额定电流300A的动铁心式下降特性弧焊变压器；BX3-300为额定300A动绕组式；BX6-140为额定140A抽头式（调节35~190A、负载持续率10%）。"], ["焊条电弧焊为什么要求电源具有恒流（陡降）外特性并带外拖？", "焊条电弧焊电弧在静特性水平段，恒流特性保证焊接电流不随弧长变化而明显改变（弧长变化时电压变化、电流基本稳定），焊接规范稳定；短路引弧与熔滴过渡瞬间需要较大短路电流，外拖段提供足够电流（如外拖拐点电压Uth取8~15V以下进入大电流段），保证引弧容易、熔滴过渡顺畅，又不至于飞溅过大。"]]}, {"title": "课后思考与作业（课程PPT对应内容）", "items": [["说明LEM磁平衡式电流传感器的工作原理。", "LEM传感器由原边线圈（流过被测电流Id）、副边线圈与磁芯组成。副边补偿电流Is产生的磁势与Id产生的磁势相平衡时（IsNs=IdNd等安匝原理），磁芯磁通为零，霍尔元件输出为零；平衡状态下Is与Id成正比，Is经放大后输出，从而无损耗地测量大电流，反应时间约1μs，抗干扰、可测任意波形。"], ["7815稳压电源的输出电压是多少？三端固定稳压器使用时应注意什么？", "7815输出+15V（78XX系列末两位为输出电压，7805=+5V、7812=+12V、7815=+15V；79XX输出负电压）。使用注意：①输入电压须高于输出电压2V以上（UI>Uo+2V）；②注意散热（加散热片）；③输入输出加电容滤波与防自激；④有过热、过流保护，但需限制最大输入电压。"], ["电子控制型弧焊电源外特性负反馈控制的基本公式是什么？改变反馈取法可得到哪些外特性？", "Uk=K3[K1(Ugu−mUf)+K2(Ugi−nIf)]。只取电压负反馈→平（恒压）特性；只取电流负反馈→陡降（恒流）特性；电压电流同时反馈→斜线特性（斜率可调）；分时反馈→陡降带外拖（阈值8~15V）；恒压+电流截止→平特性限制短路电流。"], ["直测式霍尔传感器输出电压与哪些量有关？使用中有什么要求？", "UH=KH·I·B/d=SH·IB，与霍尔系数KH（或灵敏度SH=KH/d）、控制电流I、磁感应强度B成正比，与霍尔片厚度d成反比。使用要求：控制电流用恒流源供电（保证灵敏度稳定）；输出为毫伏级需放大；无惯性、响应快、隔离性能好，可防止磁干扰。"], ["分析短路过渡飞溅的成因，说明STT波形控制策略。", "成因：短路初期接触处电流密度大、电磁收缩力Fcz∝I²急剧增大，产生排斥瞬时飞溅；短路末期缩颈处电流密度高，大电流下液桥爆断产生细颗粒飞溅；表面张力Fσ=2πrσ始终促进铺展、阻碍爆断。STT策略：短路初期快速降流抑制收缩力防瞬时飞溅→中期增流促铺展缩颈→缩颈末期检测电压变化降流，靠表面张力断桥→燃弧期分段恒流控制成形。"]]}, {"title": "课后思考与作业（课程PPT对应内容）", "items": [["画出三相可控整流的比较表（半控桥/全控桥/六相半波/双反星形的晶闸管数、Ud、输出脉动、每管承担电流、移相范围）。", "三相半控桥：3管+3二极管、Ud=1.17U2(1+cosα)、3脉动、每管1/3、移相0~180°；三相全控桥：6管、Ud=2.34U2cosα、6脉动、每管1/3、移相0~120°（电阻）/0~90°（电感）；六相半波：6管、Ud=1.35U2cosα、6脉动、每管1/6、移相0~90°（电感）；双反星形：6管（两组三相半波）、Ud=1.17U2cosα、6波峰、每管1/6、触发互差120°。"], ["晶闸管弧焊整流器的触发电路有哪些要求？ZX5系列为什么用两套触发电路？", "要求：脉冲功率2~4V、50~200mA；与主电路同步；移相范围足够；前沿陡。ZX5系列主电路为双反星形，两组晶闸管分别为共阳极组与共阴极组，同相晶闸管共用一个触发电路，故两套触发电路即可分别触发两组管子（六套为每管独立触发、三套为同相触发）。"], ["带平衡电抗器的双反星形整流电路为什么能提高晶闸管利用率？", "两组三相半波整流电源直接并联时，任一瞬时只有电压较高的一组导通，晶闸管利用率低。加平衡电抗器后，LB承受两组输出电压之差，使两组管子同时导通并联工作：每只晶闸管导通120°、承担1/6负载电流（三相半波为1/3），输出6波峰、脉动小，变压器与晶闸管利用率高、散热好，适合大电流。负载电流小于临界值（约额定2%~5%）时LB失去作用，转为六相半波工作。"], ["单结晶体管为什么能产生触发脉冲？说明其工作过程。", "单结晶体管具有负阻特性：发射极电压低于峰点电压Up时截止；达到Up后eb1间电阻突然减小、进入负阻区导通，发射极电流急增、电压降到谷点电压Uv后截止。张弛振荡器中电容充电至Up→管子导通→电容经eb1迅速放电→在基极输出尖脉冲→放电至Uv后重新充电，周而复始产生脉冲列，用作晶闸管触发脉冲。"], ["ZX5系列弧焊整流器有何特点？", "ZX5-250/400/630采用双反星形主电路（大电流、晶闸管利用率高）、两套触发电路、电流负反馈实现下降（恒流）外特性，设置引弧推力电路：短路时提供附加电流保证引弧容易、短路过渡顺畅。用于焊条电弧焊，电流调节范围宽、电弧稳定。"]]}, {"title": "课后思考与作业（课程PPT对应内容）", "items": [["什么是逆变？逆变式弧焊电源有哪几种变换形式？", "逆变是将直流电变换为交流电的过程（DC→AC），是整流的逆过程。变换形式：AC-DC-AC（输入工频交流整流后直接逆变输出，少用）；AC-DC-AC-DC（整流→逆变→高频变压→整流输出直流，直流焊机主流）；AC-DC-AC-DC-AC（再逆变输出方波交流，用于铝、镁及其合金方波交流焊）。"], ["逆变式弧焊电源为什么体积小、重量轻、效率高？", "体积小：变压器电势U∝fNSBm，工作频率由50Hz提高到20kHz，铁心截面与匝数成比例减小，变压器与电感体积重量大幅下降。效率高：中频变压器铁损铜损小、励磁电流小，开关管工作于开关状态功耗低，效率≥90%（AX7-400仅53%）、功率因数≥0.95（0.55），节能显著。"], ["比较SCR、GTR、VMOS、IGBT四类开关器件的主要参数。", "开关速度：SCR 25~100μs、GTR 1~5μs、IGBT 0.5~1μs、VMOS 0.1~0.5μs；额定电流密度：SCR 20~30、GTR 5~10、VMOS/IGBT 50~100 A/cm²；驱动方式：SCR、GTR电流驱动、驱动功率大；VMOS、IGBT电压驱动、驱动功率小。IGBT兼具高耐压、低驱动功率与较快开关速度，综合性能最优。"], ["半桥与全桥逆变电路结构有何区别？各用于什么场合？", "半桥：两个电容串联分压构成中点，两只开关管交替导通，抗不平衡能力强，变压器利用率较高，用于中小功率（KEMPPI MASTER350）；全桥：四只开关管、对角交替导通，变压器磁滞回线双侧工作、利用率最高，输出功率最大，但抗不平衡能力差、需防止上下管直通，用于大功率（米勒XMT-300）。"], ["TRC有哪三种控制方式？SG3525起什么作用？", "TRC（时间比控制）：PWM（定频调宽，频率固定改变脉宽，滤波设计简单、应用最广）、PFM（定宽调频，改变开关频率）、PWM+PFM（两者混合）。SG3525是集成PWM控制器：内含振荡器、误差放大器、PWM比较器与输出驱动级，产生两路互补的PWM信号，根据反馈误差调节脉宽，实现稳压/恒流外特性与调节。"], ["逆变弧焊电源如何形成所需的外特性？", "逆变电源输出为电压源性质，通过闭环反馈控制PWM脉宽形成外特性：取输出电压反馈→误差信号调脉宽→输出电压恒定→平特性；取输出电流反馈→恒流（陡降）特性；电压电流组合反馈→斜线、恒流带外拖等形状。调节特性通过改变给定电压Ug实现：Ug上下平移（平动）调输出电压、左右平移（降动）调电流，给定变化经误差放大器在更高频PWM环节起作用。"]]}]};

/* ========== 常量与状态 ========== */
const TYPE_NAME = {mcq:"单选题", fill:"填空题", sa:"简答/辨析"};
const LS_KEY = "hhdy_prop_v1";
let state = loadState();

function emptyState(){
  return {answers:{}, wrong:[], fav:[], stats:{done:0, ok:0, byCh:{}, firstAt:{}}, cards:{}};
}
function loadState(){
  let s = emptyState();
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ Object.assign(s, JSON.parse(raw)); }
  }catch(e){}
  migrateLegacy(s);
  return s;
}
/* 旧版本记录迁移：数字键 → id 键；旧键名合并 */
function migrateLegacy(s){
  let changed = false;
  const legacy = {answers:["hhdy_answers","answers"], wrong:["hhdy_wrong","wrong"],
                  fav:["hhdy_fav","fav"], cards:["hhdy_cards","cards"]};
  for(const k in legacy){
    for(const key of legacy[k]){
      try{
        const raw = localStorage.getItem(key);
        if(raw){
          const obj = JSON.parse(raw);
          if(k==="answers"){
            for(const qk in obj){
              if(/^\d+$/.test(qk)){ const id="q"+qk; if(!s.answers[id]){s.answers[id]=obj[qk];} changed=true; }
              else if(!s.answers[qk]){ s.answers[qk]=obj[qk]; changed=true; }
            }
          }else if(Array.isArray(obj)){
            for(const it of obj){
              const id = /^\d+$/.test(String(it)) ? "q"+it : it;
              if(!s[k].includes(id)){ s[k].push(id); changed=true; }
            }
          }
          localStorage.removeItem(key); changed = true;
        }
      }catch(e){}
    }
  }
  if(changed) saveState();
}
function saveState(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
}

/* ========== 工具 ========== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function norm(s){
  return String(s||"").toLowerCase().replace(/[\s\u3000]+/g,"").replace(/[，,。.;；、]/g,"");
}
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 1800);
}

function renderNav(){
  const nav = $("#nav"); nav.innerHTML = "";
  NAV_DEFS.forEach(d=>{
    if(d.type==="label"){
      const g = document.createElement("div"); g.className="group"; g.textContent=d.text; nav.appendChild(g);
    }else if(d.type==="ch"){
      const b = document.createElement("button");
      b.className="item"; b.innerHTML = ICONS["ch"+d.no] + '<span>'+esc(d.label)+'</span><span class="cnt">'+countOfCh(d.no)+'</span>';
      b.onclick = ()=>{ mode="chapter"; curChapter=d.no; sIdx=0; session=[]; sessionAns={}; render(); };
      if(mode==="chapter" && curChapter===d.no) b.classList.add("on");
      nav.appendChild(b);
    }else{
      const b = document.createElement("button");
      b.className="item"; b.innerHTML = (ICONS[d.icon]||"") + '<span>'+esc(d.label)+'</span>';
      b.onclick = ()=>{ enterMode(d.key); };
      if(mode===d.key) b.classList.add("on");
      nav.appendChild(b);
    }
  });
}
function countOfCh(no){
  return QUESTIONS.filter(q=>q.ch===no).length;
}

function enterMode(m){
  mode = m; sIdx = 0; session = []; sessionAns = {}; cardsSession = [];
  render();
}

function renderMTabbar(){

    '<button class="mtab'+(mode===t.key?' on':'')+'" data-k="'+t.key+'">'+t.icon+'<span>'+t.label+'</span></button>'

function showMSheet(){
  const sheet = document.getElementById("mSheet"), mask = document.getElementById("mMask");
  if(!sheet) return;
  const chs = CHAPTERS.map(c=>'<button class="sh-ch" data-no="'+c.no+'">'+ICONS["ch"+c.no]+'<span>'+c.title.replace(/^第[一二三四五六七八九十百]+章\s*/,"")+'</span><span class="cnt">'+countOfCh(c.no)+'题</span></button>').join("");

  sheet.classList.add("show");

function closeMSheet(){
  const mask = document.getElementById("mMask"), sheet = document.getElementById("mSheet");
  if(mask) mask.classList.remove("show");
  if(sheet) sheet.classList.remove("show");
}
(function(){ const m = document.getElementById("mMask"); if(m) m.onclick = closeMSheet; })();

/* ========== 会话构建 ========== */
function buildSession(){
  let ids = [];
  if(mode==="chapter"){
    ids = QUESTIONS.filter(q=>q.ch===curChapter).map(q=>q.id);
  }else if(mode==="random"){
    const all = QUESTIONS.map(q=>q.id);
    for(let i=all.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [all[i],all[j]]=[all[j],all[i]]; }
    ids = all;
  }else if(mode==="wrong"){
    ids = state.wrong.slice();
  }else if(mode==="fav"){
    ids = state.fav.slice();
  }else if(mode==="cards"){
    ids = QUESTIONS.map(q=>q.id);
  }
  return ids;
}

/* ========== 渲染主视图 ========== */
function render(){
  renderNav();
  renderMTabbar();
  updateSideFoot();
  if(mode==="stats"){ renderStats(); return; }
  if(mode==="docs"){ renderDocs(); return; }
  if(session.length===0) session = buildSession();
  if(mode==="cards"){ renderCards(); return; }
  if(session.length===0){ renderEmpty(); return; }
  if(sIdx>=session.length) sIdx = 0;
  renderQuestion(sIdx);
}

function renderEmpty(){
  $("#pageTitle").textContent = {wrong:"错题本", fav:"我的收藏"}[mode] || "刷题";
  $("#pageCrumb").textContent = "暂无题目";
  $("#progressWrap").style.display="none";
  const v = $("#view");
  const msg = mode==="wrong" ? "错题本是空的，做完并答错的题会自动收录" : "收藏夹是空的，答题时点星标即可收藏";
  v.innerHTML = '<div class="empty"><div class="t">'+msg+'</div><div>答对后可在这里复习巩固</div></div>';
}

function setProgress(){
  $("#progressWrap").style.display = (mode==="cards") ? "none" : "block";
  if(mode==="cards") return;
  const total = session.length, cur = Math.min(sIdx+1, total);
  $("#progText").textContent = cur + " / " + total;
  $("#progPct").textContent = Math.round(cur/total*100) + "%";
  $("#progBar").style.width = (cur/total*100) + "%";
}

function renderQuestion(i){
  const q = qById(session[i]);
  setProgress();
  const ch = CHAPTERS_BY_NO[q.ch];
  $("#pageTitle").textContent = modeTitle();
  $("#pageCrumb").textContent = ch.title + " · 考点：" + q.tag;
  const v = $("#view");
  const answered = !!state.answers[q.id];
  v.innerHTML = questionCardHTML(q, answered);

  // 绑定事件
  if(q.type==="mcq") bindMcq(q);
  else if(q.type==="fill") bindFill(q);
  else bindSa(q);
  bindCommon(q);
}

function modeTitle(){
  if(mode==="chapter") return "按章节刷题";
  if(mode==="random") return "随机刷题";
  if(mode==="wrong") return "错题本";
  if(mode==="fav") return "我的收藏";
  return "刷题";
}

function questionCardHTML(q, answered){
  const ch = CHAPTERS_BY_NO[q.ch];
  let body = "";
  if(q.type==="mcq"){
    body = '<div class="opts" id="opts">' + q.opts.map((o,ix)=>{
      const letter = "ABCD"[ix];
      const cls = answered ? (letter===q.ans ? " right dis" : (state.answers[q.id] && state.answers[q.id].v===letter ? " wrong dis" : " dis"))
                            : "";
      return '<button class="opt'+cls+'" data-k="'+letter+'"><span class="key">'+letter+'</span><span>'+esc(o)+'</span></button>';
    }).join("") + '</div>';
    if(answered){ body += feedbackHTML(q); }
  }else if(q.type==="fill"){
    const cur = answered ? esc(state.answers[q.id].v || "") : "";
    body = '<div class="fill-row">' +
      '<input class="fill-input" id="fillIn" placeholder="输入答案后提交" value="'+cur+'" '+(answered?"disabled":"")+'>' +
      '<button class="btn btn-pri" id="fillOk">提交</button></div>';
    if(answered){ body += feedbackHTML(q); }
  }else{
    body = '<div class="rate-row" id="saRate" style="margin-top:0">' +
      '<button class="btn btn-ghost" id="saShow">查看参考答案</button></div>';
    if(answered){ body += feedbackHTML(q, true); }
  }

  const favOn = state.fav.includes(q.id) ? " on" : "";
  const starIco = '<svg width="14" height="14" viewBox="0 0 24 24" fill="'+(state.fav.includes(q.id)?"currentColor":"none")+'" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';

  return '<div class="card">' +
    '<div class="q-head"><span class="badge b-'+q.type+'">'+TYPE_NAME[q.type]+'</span>' +
    '<span class="q-no">'+q.id+'</span><span class="q-tag">'+esc(q.tag)+'</span></div>' +
    '<div class="q-text">'+formatStem(q.q)+'</div>' + body +
    '<div class="q-foot"><div class="links">' +
    '<button class="iconbtn'+favOn+'" id="btnFav">'+starIco+'收藏</button>' +
    (mode==="wrong" ? '<button class="iconbtn" id="btnUnWrong">移出错题本</button>' : "") +
    '</div><div class="navbtns">' +
    '<button class="btn btn-line" id="btnPrev">上一题</button>' +
    '<button class="btn btn-pri" id="btnNext">下一题</button></div></div></div>';
}

function formatStem(s){
  return esc(s).replace(/____/g, '<span class="blank">____</span>');
}

function feedbackHTML(q, isSa){
  let ansLine = "";
  if(q.type==="mcq") ansLine = '正确答案：<span class="f-ans">'+q.ans+'</span>';
  else if(q.type==="fill") ansLine = '参考答案：<span class="f-ans">'+esc(q.ans[0])+'</span>';
  const ok = q.type==="sa" ? true : (state.answers[q.id] && state.answers[q.id].ok);
  const title = q.type==="sa" ? "参考答案要点" : (ok ? "回答正确" : "回答错误，记住这个考点");
  const cls = q.type==="sa" ? "ok" : (ok ? "ok" : "no");
  let extra = "";
  if(q.type==="sa"){
    const r = state.answers[q.id] && state.answers[q.id].rate;
    extra = '<div class="rate-row"><button class="btn btn-ghost" data-rate="good">已掌握</button>' +
            '<button class="btn btn-ghost" data-rate="ok">模糊</button>' +
            '<button class="btn btn-ghost" data-rate="bad">未掌握</button></div>';
    if(r){ extra = '<div class="rate-row"><span style="font-size:13px;color:var(--ink3)">自评：'+({good:"已掌握",ok:"模糊",bad:"未掌握"}[r])+'（可重新自评）</span></div>' + extra.replace('<div class="rate-row">','<div class="rate-row" style="display:none">'); }
  }
  return '<div class="feedback show '+cls+'" id="fb">' +
    '<div class="f-title">'+title+'</div>' + ansLine +
    '<div class="f-points">'+esc(q.points)+'</div>' + extra + '</div>';
}

/* ========== 答题交互 ========== */
function bindMcq(q){
  document.querySelectorAll("#opts .opt").forEach(b=>{
    b.onclick = ()=>{
      if(state.answers[q.id]) return;
      const k = b.dataset.k;
      const ok = k===q.ans;
      recordAnswer(q, {t:"mcq", v:k, ok});
      rerenderCurrent();
    };
  });
}
function bindFill(q){
  const okBtn = $("#fillOk");
  const onCheck = ()=>{
    if(state.answers[q.id]) return;
    const val = $("#fillIn").value;
    if(!norm(val)){ toast("请先输入答案"); return; }
    const ok = q.ans.some(a=>norm(a)===norm(val) || norm(a).includes(norm(val)) || norm(val).includes(norm(a)));
    recordAnswer(q, {t:"fill", v:val, ok});
    rerenderCurrent();
  };
  okBtn.onclick = onCheck;
  $("#fillIn").addEventListener("keydown", e=>{ if(e.key==="Enter") onCheck(); });
}
function bindSa(q){
  const show = $("#saShow");
  show.onclick = ()=>{
    state.answers[q.id] = Object.assign({}, state.answers[q.id], {t:"sa", v:"", ok:true, shown:true});
    saveState(); rerenderCurrent();
  };
  const fb = $("#fb");
  if(fb){
    fb.querySelectorAll("[data-rate]").forEach(b=>{
      b.onclick = ()=>{
        state.answers[q.id] = Object.assign({}, state.answers[q.id], {rate:b.dataset.rate});
        saveState(); rerenderCurrent();
      };
    });
  }
}
function bindCommon(q){
  $("#btnFav").onclick = ()=>{
    const i = state.fav.indexOf(q.id);
    if(i>=0){ state.fav.splice(i,1); toast("已取消收藏"); }
    else{ state.fav.push(q.id); toast("已收藏，可在「我的收藏」复习"); }
    saveState(); renderNav(); updateSideFoot();
    const fb = $("#btnFav");
    if(fb){ fb.classList.toggle("on", state.fav.includes(q.id)); }
  };
  const ub = $("#btnUnWrong");
  if(ub){
    ub.onclick = ()=>{
      const i = state.wrong.indexOf(q.id);
      if(i>=0){ state.wrong.splice(i,1); saveState(); }
      session.splice(sIdx,1);
      if(session.length===0){ render(); return; }
      if(sIdx>=session.length) sIdx = session.length-1;
      renderQuestion(sIdx);
    };
  }
  $("#btnPrev").onclick = ()=>{
    if(sIdx>0){ sIdx--; renderQuestion(sIdx); }
    else toast("已经是第一题");
  };
  $("#btnNext").onclick = ()=>{
    if(sIdx<session.length-1){ sIdx++; renderQuestion(sIdx); }
    else if(mode!=="chapter"){ toast("本轮已结束"); render(); }
    else { sIdx=0; renderQuestion(0); }
  };
}

function recordAnswer(q, rec){
  state.answers[q.id] = Object.assign({}, state.answers[q.id], rec, {ts:Date.now()});
  if(!sessionAns[q.id]){
    sessionAns[q.id] = true;
    state.stats.done++;
    if(rec.ok) state.stats.ok++;
    const key = String(q.ch);
    state.stats.byCh[key] = state.stats.byCh[key] || {a:0,o:0};
    state.stats.byCh[key].a++;
    if(rec.ok) state.stats.byCh[key].o++;
  }
  if(q.type!=="sa"){
    const wi = state.wrong.indexOf(q.id);
    if(rec.ok){ if(wi>=0) state.wrong.splice(wi,1); }
    else if(wi<0){ state.wrong.push(q.id); }
  }
  saveState(); renderNav(); updateSideFoot();
}
function rerenderCurrent(){ renderQuestion(sIdx); }

function updateSideFoot(){
  $("#sfDone").textContent = state.stats.done;
  $("#sfAcc").textContent = state.stats.done ? Math.round(state.stats.ok/state.stats.done*100)+"%" : "—";
  $("#sfWrong").textContent = state.wrong.length;
  $("#sfFav").textContent = state.fav.length;
}

/* ========== 页内复习资料（Word 内容内嵌，无需外部文件） ========== */
function renderDocs(){
  $("#pageTitle").textContent = "复习资料（页内版）";
  $("#pageCrumb").textContent = "Word 内容已内置本页 · 知识点 / 题库 / 简答 / 附录";
  $("#progressWrap").style.display = "none";
  const v = $("#view");
  v.innerHTML = docsHTML();
}

function docChHTML(ch){
  let h = '<div class="doc-ch">'+esc(ch.title)+'</div>';
  h += '<div class="doc-intro">'+esc(ch.intro)+'</div>';
  h += '<div class="doc-h3">知识框架要点</div>';
  ch.points.forEach(p=>{ h += '<div class="doc-point"><b>【'+esc(p[0])+'】</b>'+esc(p[1])+'</div>'; });
  h += '<div class="doc-h3">易混名词辨析</div>';
  h += '<table class="d-table"><tr><th>概念对</th><th>核心区别</th></tr>';
  ch.disc.forEach(d=>{ h += '<tr><td>'+esc(d[0])+'</td><td>'+esc(d[1])+'</td></tr>'; });
  h += '</table>';
  return h;
}

function docBankHTML(ch){
  let h = '<div class="doc-ch">'+esc(ch.title)+'</div>';
  h += '<div class="doc-h3">一、单选题</div>';
  ch.mcq.forEach(q=>{
    h += '<div class="d-q"><div class="d-qhead"><span class="d-type mcq">单选题</span><span class="d-tag">考点：'+esc(q.tag)+'</span></div>' +
         '<div class="d-qtext">'+formatStem(q.q)+'</div>' +
         '<div class="d-opts">'+q.opts.map((o,i)=>esc("ABCD"[i]+"．"+o)).join("<br>")+'</div>' +
         '<details class="d-ans"><summary>答案与解析</summary><div class="a-line">答案：'+esc(q.ans)+'</div><div class="p-line">'+esc(q.points)+'</div></details></div>';
  });
  h += '<div class="doc-h3">二、填空题</div>';
  ch.fill.forEach(q=>{
    h += '<div class="d-q"><div class="d-qhead"><span class="d-type fill">填空题</span><span class="d-tag">考点：'+esc(q.tag)+'</span></div>' +
         '<div class="d-qtext">'+formatStem(q.q)+'</div>' +
         '<details class="d-ans"><summary>答案与解析</summary><div class="a-line">参考答案：'+esc(q.ans.join(" / "))+'</div><div class="p-line">'+esc(q.points)+'</div></details></div>';
  });
  return h;
}

function docSAHTML(ch){
  let h = '<div class="doc-ch">'+esc(ch.title)+'</div>';
  ch.sa.forEach((q,i)=>{
    h += '<div class="d-sa-q">'+(i+1)+'. '+formatStem(q.q)+'（考点：'+esc(q.tag)+'）</div>';
    h += '<div class="d-block"><div class="lb">参考答案要点</div>'+esc(q.points).replace(/\n/g,"<br>")+'</div>';
  });
  return h;
}

function docsHTML(){
  const st = DOCS_DATA.stats;
  const rows = [];
  let tot = {mcq:0, fill:0, sa:0, total:0};
  for(let c=1;c<=6;c++){
    const s = st[c];
    rows.push('<tr><td>第'+c+'章</td><td>'+s.mcq+'</td><td>'+s.fill+'</td><td>'+s.sa+'</td><td>'+s.total+'</td></tr>');
    tot.mcq+=s.mcq; tot.fill+=s.fill; tot.sa+=s.sa; tot.total+=s.total;
  }
  rows.push('<tr><td>合计</td><td>'+tot.mcq+'</td><td>'+tot.fill+'</td><td>'+tot.sa+'</td><td>'+tot.total+'</td></tr>');

  let h = '<div class="docs">';
  h += '<div class="docs-toolbar">' +
    '<button class="btn btn-pri" onclick="enterMode(\'chapter\')">返回刷题</button>' +
    '<span class="jump">跳转：</span>' +
    '<button class="btn btn-line" onclick="document.getElementById(\'dp1\').scrollIntoView()">第一部分 · 知识点</button>' +
    '<button class="btn btn-line" onclick="document.getElementById(\'dp2\').scrollIntoView()">第二部分 · 题库</button>' +
    '<button class="btn btn-line" onclick="document.getElementById(\'dp3\').scrollIntoView()">第三部分 · 简答专题</button>' +
    '<button class="btn btn-line" onclick="document.getElementById(\'dap\').scrollIntoView()">附录 · 思考题</button>' +
    '</div>';

  h += '<div class="doc-h3">题库构成一览</div><table class="d-table">' +
    '<tr><th>章节</th><th>单选题</th><th>填空题</th><th>简答/辨析</th><th>合计</th></tr>' +
    rows.join("") + '</table>';

  h += '<div class="doc-sec" id="dp1">第一部分　章节知识点梳理</div>';
  DOCS_DATA.part1.forEach(ch=>{ h += docChHTML(ch); });

  h += '<div class="doc-sec s2" id="dp2">第二部分　快速记忆题库</div>';
  DOCS_DATA.part2.forEach(ch=>{ h += docBankHTML(ch); });

  h += '<div class="doc-sec s2" id="dp3">第三部分　简答题与名词解释专题（考试重点）</div>';
  DOCS_DATA.part3.forEach(ch=>{ h += docSAHTML(ch); });

  h += '<div class="doc-sec s2" id="dap">附录　课后思考题参考</div>';
  h += '<div class="d-note">以下题目来自课程PPT各章末尾的作业/思考题，按章节归类整理，参考答案基于课件内容编写；课件未展开的概念已注明。</div>';
  DOCS_DATA.appendix.forEach(ap=>{
    h += '<div class="doc-ch">'+esc(ap.title)+'</div>';
    ap.items.forEach((it,i)=>{
      h += '<div class="d-sa-q">'+(i+1)+'. '+formatStem(it[0])+'</div>';
      h += '<div class="d-block"><div class="lb">参考答案</div>'+esc(it[1]).replace(/\n/g,"<br>")+'</div>';
    });
  });
  h += '<div class="empty" style="padding:26px 0 10px"><div class="t">已到底部</div><div>本页为 Word 复习资料的内容内嵌版，无需再打开外部文件。</div></div>';
  h += '</div>';
  return h;
}

/* ========== 统计视图 ========== */
function renderStats(){
  $("#pageTitle").textContent = "答题统计";
  $("#pageCrumb").textContent = "学习进度一览";
  $("#progressWrap").style.display = "none";
  const acc = state.stats.done ? Math.round(state.stats.ok/state.stats.done*100) : 0;
  const doneTotal = QUESTIONS.length;
  let mastered = 0, fuzzy = 0, unlearned = 0;
  Object.keys(state.cards).forEach(id=>{
    const r = state.cards[id];
    if(r==="good") mastered++; else if(r==="ok") fuzzy++; else unlearned++;
  });
  const v = $("#view");
  let rows = CHAPTERS.map(c=>{
    const s = state.stats.byCh[c.no] || {a:0,o:0};
    const n = countOfCh(c.no);
    const pct = n? Math.round(s.a/n*100) : 0;
    return '<div class="ch-row"><span class="ch-name">'+esc(c.title)+'</span>' +
      '<span class="ch-bar"><i style="width:'+pct+'%"></i></span>' +
      '<span class="ch-num">已答 '+s.a+'/'+n+' · 正确 '+s.o+' · 正确率 '+(s.a?Math.round(s.o/s.a*100):0)+'%</span></div>';
  }).join("");
  v.innerHTML =
    '<div class="stat-grid">' +
      '<div class="stat"><div class="k">累计答题</div><div class="v">'+state.stats.done+'<small> / '+doneTotal+'</small></div></div>' +
      '<div class="stat accent"><div class="k">正确率</div><div class="v">'+acc+'<small>%</small></div></div>' +
      '<div class="stat"><div class="k">错题本</div><div class="v">'+state.wrong.length+'</div></div>' +
      '<div class="stat"><div class="k">掌握 · 模糊 · 未掌握</div><div class="v">'+mastered+' · '+fuzzy+' · '+unlearned+'</div></div>' +
    '</div>' +
    '<div class="card ch-stats"><div class="q-head"><span class="badge b-mcq">各章进度</span></div>'+rows+'</div>' +
    '<div class="empty" style="padding:34px 0 10px"><div class="t">提示</div><div>答题与自评记录自动保存在本机浏览器（localStorage），换设备或清缓存会丢失；重新加题时记录会自动迁移保留。</div></div>';
}

/* ========== 速记卡片 ========== */
function renderCards(){
  $("#pageTitle").textContent = "速记卡片";
  $("#pageCrumb").textContent = "翻牌回忆 · 自评掌握程度";
  $("#progressWrap").style.display = "none";
  const v = $("#view");
  if(cardsSession.length===0){
    cardsSession = QUESTIONS.slice();
    for(let i=cardsSession.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [cardsSession[i],cardsSession[j]]=[cardsSession[j],cardsSession[i]]; }
  }
  if(cardsSession.length===0){ renderEmpty(); return; }
  const q = cardsSession[0];
  const ch = CHAPTERS_BY_NO[q.ch];
  const back = q.type==="mcq" ? ("正确答案："+q.ans+"　"+q.opts["ABCD".indexOf(q.ans)]+"\n\n"+q.points)
            : q.type==="fill" ? ("参考答案："+q.ans.join(" / ")+"\n\n"+q.points)
            : q.points;
  v.innerHTML =
    '<div class="flash-wrap"><div class="flash" id="flash">' +
      '<div class="f-front"><div class="cap">'+ch.title+' · '+TYPE_NAME[q.type]+' · '+esc(q.tag)+'</div>' +
        '<div class="big">'+formatStem(q.q)+'</div></div>' +
      '<div class="f-back"><div class="cap">参考答案</div><div class="back-body">'+esc(back)+'</div></div>' +
    '</div>' +
    '<div class="flash-ctl">' +
      '<button class="btn btn-ghost" id="flip">翻看答案</button>' +
      '<button class="btn btn-ghost" data-rate="good">已掌握</button>' +
      '<button class="btn btn-ghost" data-rate="ok">模糊</button>' +
      '<button class="btn btn-ghost" data-rate="bad">未掌握</button>' +
    '</div></div>';
  $("#flip").onclick = ()=>{ $("#flash").classList.toggle("flipped"); };
  v.querySelectorAll("[data-rate]").forEach(b=>{
    b.onclick = ()=>{
      state.cards[q.id] = b.dataset.rate;
      saveState(); cardsSession.shift(); renderCards();
    };
  });
}

/* ========== 启动 ========== */
const __chipT = document.getElementById("chipTotal");
const __chipC = document.getElementById("chipChs");
if(__chipT){ __chipT.textContent = QUESTIONS.length + " 题"; }
if(__chipC){ __chipC.textContent = Object.keys(CHAPTERS_BY_NO).length + "章全覆盖"; }
/* 移动端打开即刷题：小屏/手机默认直接进入随机刷题 */
if(/Android|iPhone|iPad|iPod|Mobile|MicroMessenger|Opera Mini/i.test(navigator.userAgent) || innerWidth<=860){
  mode = "random";
}
render();
</script>
